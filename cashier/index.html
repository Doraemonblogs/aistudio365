<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>扫码付款 - AIStudio365</title>
<!--
  Scan-to-pay cashier. Dujiao-Next's 易支付 (v1, redirect) channel sends buyers here as
  /cashier/submit.php?type=alipay|wxpay&money=..&name=<order no>&out_trade_no=..&...
  Nothing here is trusted: it only shows the seller's personal QR code and what to do next.
  Customer service checks the real income record and confirms the order in the admin.
  QR lookup order: qr/<alipay|wechat>-<amount>.<png|jpg|webp> (fixed-amount code, e.g. wechat-125.00.png),
  then qr/<alipay|wechat>.<png|jpg|webp>.
-->
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1f2328; --muted: #6b7280; --line: #e5e7eb;
    --accent: #1677ff; --accent-weak: #e8f1ff; --warn-bg: #fff7e6; --warn-text: #ad6800;
    --wechat: #07c160; --alipay: #1677ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #181b21; --text: #e6e8eb; --muted: #9aa3ad; --line: #2a2f37;
      --accent: #4c94ff; --accent-weak: #1b2a44; --warn-bg: #2b2210; --warn-text: #f0b44c;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
  .wrap { max-width: 440px; margin: 0 auto; padding: 16px 16px 40px; }
  .brand { display: flex; align-items: center; gap: 10px; margin: 4px 0 14px; font-weight: 700; font-size: 17px; }
  .brand img { width: 32px; height: 32px; border-radius: 50%; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 14px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .label { color: var(--muted); font-size: 13px; }
  .order-no { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; word-break: break-all; }
  .amount { font-size: 34px; font-weight: 800; letter-spacing: .5px; margin: 6px 0 2px; }
  .amount small { font-size: 18px; font-weight: 700; margin-right: 2px; }
  .method { display: inline-block; padding: 2px 10px; border-radius: 999px; color: #fff; font-size: 13px; font-weight: 600; }
  .qr-box { text-align: center; }
  .qr-box img { width: 100%; max-width: 280px; border-radius: 12px; border: 1px solid var(--line); background: #fff; }
  .qr-missing { padding: 48px 12px; border: 2px dashed var(--line); border-radius: 12px; color: var(--muted); }
  .hint { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .notice { background: var(--warn-bg); color: var(--warn-text); border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-top: 12px; }
  ol.steps { margin: 0; padding-left: 20px; }
  ol.steps li { margin: 6px 0; }
  .copy { border: 1px solid var(--line); background: var(--card); color: var(--accent); border-radius: 8px;
    padding: 3px 10px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .btn { display: block; width: 100%; text-align: center; text-decoration: none; background: var(--accent); color: #fff;
    border-radius: 12px; padding: 12px; font-weight: 700; font-size: 16px; }
  .btn.secondary { background: var(--accent-weak); color: var(--accent); margin-top: 10px; }
  .wx { font-weight: 700; }
  .error { text-align: center; color: var(--muted); padding: 30px 10px; }
  .toast { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%); background: rgba(0,0,0,.8); color: #fff;
    padding: 8px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img src="/uploads/common/2026/11/f156877b-a106-4b00-bf2e-733195fb43a8.png" alt="" onerror="this.remove()">
    <span>AIStudio365 收银台</span>
  </div>

  <div id="app"></div>
</div>
<div id="toast" class="toast"></div>

<script>
(function () {
  var WECHAT_ID = 'aistudio361';
  var params = new URLSearchParams(location.search);
  var type = (params.get('type') || '').toLowerCase();
  var money = (params.get('money') || '').trim();
  var name = (params.get('name') || '').trim();
  var tradeNo = (params.get('out_trade_no') || '').trim();
  var orderNo = /^DJ[0-9A-Za-z-]+$/.test(name) ? name : tradeNo;

  // Dujiao-Next puts guest=1 in return_url for guest orders. Guests go to the guest order detail
  // page (order info, items, delivery content, contact); its credentials are already in this
  // tab's sessionStorage from checkout. Member orders fall back to /pay.
  var isGuestOrder = false;
  try {
    var ret = new URL(params.get('return_url') || '', location.origin);
    isGuestOrder = ret.origin === location.origin && ret.searchParams.get('guest') === '1';
  } catch (e) { /* missing or malformed return_url: treat as member order */ }
  var orderHref = isGuestOrder
    ? '/guest/orders/' + encodeURIComponent(orderNo)
    : '/pay?order_no=' + encodeURIComponent(orderNo);

  var methods = {
    alipay: { label: '支付宝', file: 'alipay', color: 'var(--alipay)' },
    wxpay:  { label: '微信',   file: 'wechat', color: 'var(--wechat)' },
    wechat: { label: '微信',   file: 'wechat', color: 'var(--wechat)' }
  };
  var method = methods[type];
  var app = document.getElementById('app');

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') node.textContent = attrs[k];
      else if (k === 'style') node.style.cssText = attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return node;
  }

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, 1600);
  }

  function copyButton(value, done) {
    var b = el('button', { type: 'button', 'class': 'copy', text: '复制' });
    b.addEventListener('click', function () {
      function fallback() {
        var ta = el('textarea', { style: 'position:fixed;opacity:0' }); ta.value = value;
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); toast(done); } catch (e) { toast('复制失败，请手动复制'); }
        ta.remove();
      }
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(value).then(function () { toast(done); }, fallback);
      } else { fallback(); }
    });
    return b;
  }

  if (!method || !/^\d+(\.\d{1,2})?$/.test(money) || !orderNo) {
    app.appendChild(el('div', { 'class': 'card error' }, [
      el('p', { text: '付款信息不完整，请回到商店重新下单。' }),
      el('a', { 'class': 'btn', href: '/', text: '返回商店' })
    ]));
    return;
  }

  var amount = Number(money).toFixed(2);

  // Order summary
  app.appendChild(el('div', { 'class': 'card' }, [
    el('div', { 'class': 'row' }, [
      el('span', { 'class': 'label', text: '应付金额' }),
      el('span', { 'class': 'method', style: 'background:' + method.color, text: method.label + '扫码' })
    ]),
    el('div', { 'class': 'amount' }, [el('small', { text: '¥' }), amount]),
    el('div', { 'class': 'row', style: 'margin-top:10px' }, [
      el('div', {}, [el('div', { 'class': 'label', text: '订单号' }), el('div', { 'class': 'order-no', text: orderNo })]),
      copyButton(orderNo, '订单号已复制')
    ])
  ]));

  // QR code: fixed-amount code first, then the generic one
  var qrHint = el('div', { 'class': 'notice', text: '请在付款页面手动输入金额 ¥' + amount + '，金额必须一致。' });
  var qrMissing = el('div', { 'class': 'qr-missing', text: method.label + '收款码尚未上传，请先联系客服微信 ' + WECHAT_ID + ' 付款。' });
  var img = el('img', { alt: method.label + '收款码' });
  var fixedBase = 'qr/' + method.file + '-' + amount;
  var candidates = [];
  [fixedBase, 'qr/' + method.file].forEach(function (base) {
    ['.png', '.jpg', '.webp'].forEach(function (ext) { candidates.push(base + ext); });
  });
  var idx = 0;
  img.onload = function () {
    if (candidates[idx].indexOf(fixedBase) === 0) { qrHint.textContent = '该收款码已固定金额 ¥' + amount + '，扫码后直接付款即可。'; }
  };
  img.onerror = function () {
    idx += 1;
    if (idx < candidates.length) { img.src = candidates[idx]; }
    else { img.replaceWith(qrMissing); qrHint.remove(); }
  };
  img.src = candidates[0];

  app.appendChild(el('div', { 'class': 'card qr-box' }, [
    img,
    el('div', { 'class': 'hint', text: '手机用户：长按或截图保存收款码，在' + method.label + '「扫一扫」中从相册选择图片付款。' }),
    qrHint
  ]));

  // What to do next
  var wx = el('span', { 'class': 'wx', text: WECHAT_ID });
  app.appendChild(el('div', { 'class': 'card' }, [
    el('div', { style: 'font-weight:700;margin-bottom:6px', text: '付款后请按以下步骤操作' }),
    el('ol', { 'class': 'steps' }, [
      el('li', { text: '用' + method.label + '扫码，付款 ¥' + amount + '（可在备注里填写订单号）。' }),
      el('li', { text: '截图付款成功页面。' }),
      el('li', {}, [
        el('div', { 'class': 'row' }, [el('span', {}, ['添加客服微信 ', wx]), copyButton(WECHAT_ID, '微信号已复制')]),
        el('div', { 'class': 'hint', style: 'margin-top:2px', text: '发送「付款截图 + 订单号」' })
      ]),
      el('li', { text: '客服核实到账后立即为你办理，大约 5 分钟完成。' })
    ]),
    el('div', { 'class': 'notice', text: '客服确认收款前，订单会显示「待支付」，属正常情况。订单 60 分钟内未确认会自动关闭；如已付款，请直接联系客服处理，不会影响办理。' })
  ]));

  app.appendChild(el('a', { 'class': 'btn', href: orderHref, text: '我已付款，查看订单' }));
  app.appendChild(el('a', { 'class': 'btn secondary', href: '/', text: '返回商店' }));
})();
</script>
</body>
</html>
