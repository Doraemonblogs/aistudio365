# Dujiao-Next shop at aistudio365.duckdns.org. certbot adds the HTTPS listener and the
# HTTP->HTTPS redirect to this file, so deploy.sh installs it only when it is missing.
server {
    listen 80;
    listen [::]:80;
    server_name aistudio365.duckdns.org;

    client_max_body_size 50m;

    # Scan-to-pay cashier (static). The 易支付 channels redirect buyers to /cashier/submit.php.
    location = /cashier/submit.php {
        alias /var/www/aistudio365-cashier/index.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location /cashier/ {
        alias /var/www/aistudio365-cashier/;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
